<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Panel</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <header class="mb-5 text-center">
            <h1 class="display-5 fw-bold">CLT Panel Calculator</h1>
            <p class="text-muted">Analyze structural properties of CLT panels</p>
        </header>
        
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Panel Configuration</h5>
                        <form id="calculationForm">
                            <div class="mb-3">
                                <label for="methodSelect" class="form-label fw-semibold">Analytical Method</label>
                                <select class="form-select" id="methodSelect" name="method">
                                    <option value="shear-analogy">Shear Analogy</option>
                                    <option value="gamma">Gamma</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="layerCount" class="form-label fw-semibold">Number of Layers</label>
                                <input type="number" class="form-control" id="layerCount" min="3" max="9" value="5" required>
                                <div class="invalid-feedback" id="layerCountFeedback"></div>
                            </div>

                            <div id="layerInputs" class="mb-3">
                                <label class="form-label fw-semibold">Layer Properties</label>
                                <!-- Generated inputs -->
                            </div>

                            <div class="mb-4" id="lengthInputGroup">
                                <label for="length" class="form-label fw-semibold">Length (meters)</label>
                                <input type="number" class="form-control" id="length" min="0.1" step="0.1" value="3.0" disabled required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">Calculate Panel Properties</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Calculation Results</h5>
                        <div id="results" class="text-muted">
                            <p class="text-center pt-5">Fill in the details and click Calculate to see results here.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="calculator.js" type="module"></script>
</body>
</html>
